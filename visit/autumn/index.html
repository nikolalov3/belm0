<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu jesienne · Café Belmont</title>
<meta name="description" content="Sezonowe menu jesienne Café Belmont — matcha, kawa specialty i hojicha.">
<meta name="theme-color" content="#FAF6EE">
<link rel="canonical" href="https://belmont.cafe/visit/autumn/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23D9691E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<script defer src="https://stats.toodip.com/s.js" data-id="0c511152-cd70-41dc-961c-f5704fdab10f"></script>
<style>
  :root {
    --bg: #FAF6EE;
    --panel: #EFE5D3;
    --ink: #201A13;
    --muted: rgba(32,26,19,.50);
    --faint: rgba(32,26,19,.30);
    --line: rgba(32,26,19,.12);
    --orange: #D9691E;
    --radius: 2px;
    --display: 'Shippori Mincho', 'Times New Roman', serif;
    --sans: 'Zen Kaku Gothic New', system-ui, -apple-system, sans-serif;
  }

  * , *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    overflow-x: hidden;
  }

  img { display: block; max-width: 100%; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }

  .wrap { max-width: 620px; margin: 0 auto; padding: 26px 22px 70px; }

  /* ---- top ---- */
  .top { margin-bottom: 34px; }
  .top a {
    display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none; color: var(--muted);
    font-size: 11px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase;
    transition: color .15s ease;
  }
  .top a:hover { color: var(--orange); }

  /* ---- hero ---- */
  .hero { position: relative; }
  .hero-jp {
    font-family: var(--display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .1em;
    color: var(--orange);
    margin: 0 0 10px;
  }
  .hero h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(34px, 9vw, 46px);
    line-height: 1.05;
    letter-spacing: -.01em;
    margin: 0;
  }

  /* ---- section ---- */
  .section { margin-top: 44px; position: relative; }

  /* comic-sticker badge, floats over the top-left corner of the accordion */
  .sec-badge {
    position: absolute;
    top: -14px; left: 16px;
    z-index: 2;
    display: flex; align-items: baseline; gap: 7px;
    background: var(--bg);
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    padding: 6px 14px 6px 12px;
    box-shadow: 4px 4px 0 0 var(--orange);
    transform: rotate(-2deg);
  }
  .sec-badge .jp {
    font-family: var(--display);
    font-weight: 700;
    font-size: 16px;
    color: var(--orange);
    line-height: 1;
  }
  .sec-badge .en {
    font-size: 10px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink);
  }

  /* ---- accordion ---- */
  .acc {
    display: flex;
    gap: 4px;
    height: 300px;
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    padding: 14px 4px 4px;
    background: var(--bg);
  }
  .acc-panel {
    position: relative;
    flex: 0.62;
    overflow: hidden;
    border-radius: var(--radius);
    cursor: pointer;
    transition: flex .5s cubic-bezier(.4,0,.2,1);
    background-color: var(--panel);
  }
  .acc-panel.active { flex: 3.6; cursor: default; }

  .acc-panel img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .5s ease;
  }
  .acc-panel:not(.active):hover img { transform: scale(1.04); }

  /* vertical label on collapsed strips */
  .acc-label {
    position: absolute; inset: 0;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 16px;
    writing-mode: vertical-rl;
    font-size: 11px; font-weight: 700;
    letter-spacing: .12em;
    color: #fff;
    text-shadow: 0 1px 6px rgba(0,0,0,.45);
    transition: opacity .25s ease;
    pointer-events: none;
  }
  .acc-panel.active .acc-label { opacity: 0; }

  /* overlay shown only on active panel */
  .acc-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 22px;
    background: linear-gradient(to top, rgba(20,14,8,.68) 0%, rgba(20,14,8,.06) 55%, transparent 100%);
    color: #fff;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .3s ease .12s, transform .3s ease .12s;
    pointer-events: none;
  }
  .acc-panel.active .acc-overlay { opacity: 1; transform: none; pointer-events: auto; }

  .acc-name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .acc-name strong {
    font-family: var(--display);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -.005em;
  }
  .acc-jp { font-size: 12px; font-weight: 500; opacity: .82; }
  .acc-desc { margin: 8px 0 0; font-size: 12.5px; line-height: 1.55; opacity: .88; max-width: 34ch; }

  @media (max-width: 520px) {
    .acc { height: 260px; }
    .acc-name strong { font-size: 17px; }
  }

  /* ---- footer ---- */
  .foot {
    margin-top: 56px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 10px 20px;
    font-size: 10.5px; font-weight: 500;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .foot a { color: var(--muted); text-decoration: none; transition: color .15s ease; }
  .foot a:hover { color: var(--orange); }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <a href="/visit/">← Wizytówka</a>
  </div>

  <section class="hero">
    <p class="hero-jp">秋のメニュー</p>
    <h1>Menu jesienne</h1>
  </section>

  <!-- MATCHA -->
  <section class="section">
    <div class="sec-badge"><span class="jp">抹茶</span><span class="en">Matcha</span></div>

    <div class="acc">
      <button class="acc-panel active" type="button" aria-label="Apple Pie Matcha">
        <span class="acc-label">Apple Pie Matcha</span>
        <div class="acc-overlay">
          <div class="acc-name"><strong>Apple Pie Matcha</strong><span class="acc-jp">アップルパイ抹茶</span></div>
          <p class="acc-desc">Szarlotkowa latte — matcha ceremonialna YUME, prażone jabłko, cynamon, syrop klonowy.</p>
        </div>
      </button>
      <button class="acc-panel" type="button" aria-label="Chai Matcha">
        <img src="/img/jesien/chai.jpg" alt="Chai Matcha" loading="lazy">
        <span class="acc-label">Chai Matcha</span>
        <div class="acc-overlay">
          <div class="acc-name"><strong>Chai Matcha</strong><span class="acc-jp">チャイ抹茶</span></div>
          <p class="acc-desc">Matcha ceremonialna YUME spotyka korzenny syrop chai. Bez espresso i czarnej herbaty.</p>
        </div>
      </button>
    </div>
  </section>

  <!-- KAWA -->
  <section class="section">
    <div class="sec-badge"><span class="jp">珈琲</span><span class="en">Coffee</span></div>

    <div class="acc">
      <button class="acc-panel active" type="button" aria-label="Ginger Date Latte">
        <img src="/img/jesien/ginger-date.jpg" alt="Ginger Date Latte" loading="lazy">
        <span class="acc-label">Ginger Date Latte</span>
        <div class="acc-overlay">
          <div class="acc-name"><strong>Ginger Date Latte</strong><span class="acc-jp">ジンジャーデーツラテ</span></div>
          <p class="acc-desc">Espresso specialty słodzone syropem daktylowym, ostro przecięte imbirem. Bez białego cukru.</p>
        </div>
      </button>
      <button class="acc-panel" type="button" aria-label="Hazelnut S'Mores Latte">
        <img src="/img/jesien/smores.jpg" alt="Hazelnut S'Mores Latte" loading="lazy">
        <span class="acc-label">S'Mores Latte</span>
        <div class="acc-overlay">
          <div class="acc-name"><strong>Hazelnut S'Mores Latte</strong><span class="acc-jp">ヘーゼルナッツスモアラテ</span></div>
          <p class="acc-desc">Espresso, sos orzechowo-karmelowy i dwie pianki marshmallow opalane na żywo.</p>
        </div>
      </button>
      <button class="acc-panel" type="button" aria-label="Banana Bread & Maple Foam Iced Latte">
        <img src="/img/jesien/banana-bread.jpg" alt="Banana Bread & Maple Foam Iced Latte" loading="lazy">
        <span class="acc-label">Banana Bread</span>
        <div class="acc-overlay">
          <div class="acc-name"><strong>Banana Bread &amp; Maple Foam</strong><span class="acc-jp">バナナブレッド</span></div>
          <p class="acc-desc">Mrożone latte z pulpą bananową, cynamonem i cold foamem na klonowym syropie. Nie wegańskie.</p>
        </div>
      </button>
    </div>
  </section>

  <!-- HERBATA -->
  <section class="section">
    <div class="sec-badge"><span class="jp">茶</span><span class="en">Tea</span></div>

    <div class="acc" style="height:220px">
      <button class="acc-panel active" type="button" aria-label="Hazelnut Hojicha">
        <img src="/img/jesien/hojicha.jpg" alt="Hazelnut Hojicha" loading="lazy">
        <span class="acc-label">Hazelnut Hojicha</span>
        <div class="acc-overlay">
          <div class="acc-name"><strong>Hazelnut Hojicha</strong><span class="acc-jp">ヘーゼルナッツほうじ茶</span></div>
          <p class="acc-desc">Wypalana japońska herbata z sosem orzechowo-karmelowym. Mało kofeiny, bez kawy.</p>
        </div>
      </button>
    </div>
  </section>

  <div class="foot">
    <a href="/visit/">← Wizytówka</a>
    <a href="/#menu">Pełne menu</a>
    <a href="https://instagram.com/cafe_belmont" target="_blank" rel="noopener">Instagram</a>
  </div>

</div>
<script>
(function(){
  document.querySelectorAll('.acc').forEach(function(acc){
    var panels = acc.querySelectorAll('.acc-panel');
    panels.forEach(function(p){
      p.addEventListener('click', function(){
        if (p.classList.contains('active')) return;
        panels.forEach(function(x){ x.classList.remove('active'); });
        p.classList.add('active');
      });
    });
  });
})();
</script>
</body>
</html>
