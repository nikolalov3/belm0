<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autumn Menu · Café Belmont</title>
<meta name="description" content="Café Belmont's seasonal autumn menu — matcha, specialty coffee and hojicha.">
<meta name="theme-color" content="#FAF6EE">
<link rel="canonical" href="https://belmont.cafe/visit/autumn/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23D9691E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<script defer src="https://stats.toodip.com/s.js" data-id="0c511152-cd70-41dc-961c-f5704fdab10f"></script>
<style>
  :root {
    --bg: #FAF6EE;
    --panel: #EFE5D3;
    --ink: #201A13;
    --muted: rgba(32,26,19,.50);
    --faint: rgba(32,26,19,.30);
    --line: rgba(32,26,19,.12);
    --orange: #D9691E;
    --radius: 2px;
    --display: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    --sans: 'Zen Kaku Gothic New', system-ui, -apple-system, sans-serif;
  }

  * , *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    overflow-x: hidden;
  }

  img { display: block; max-width: 100%; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }

  .wrap { max-width: 620px; margin: 0 auto; padding: 26px 22px 70px; }

  /* ---- top ---- */
  .top { margin-bottom: 34px; }
  .top a {
    display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none; color: var(--muted);
    font-size: 11px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase;
    transition: color .15s ease;
  }
  .top a:hover { color: var(--orange); }

  /* ---- hero ---- */
  .hero {
    position: relative;
    text-align: center;
  }
  .hero-jp {
    font-family: var(--display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .1em;
    color: var(--orange);
    margin: 0 0 10px;
  }
  .hero h1 {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(24px, 6vw, 30px);
    line-height: 1.2;
    letter-spacing: .2em;
    text-transform: uppercase;
    margin: 0;
    color: var(--ink);
  }

  /* ---- section ---- */
  .section { margin-top: 44px; position: relative; }

  /* comic-sticker badge, floats over the top-left corner of the accordion */
  .sec-badge {
    position: absolute;
    top: -14px; left: 16px;
    z-index: 2;
    display: flex; align-items: baseline; gap: 7px;
    background: var(--bg);
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    padding: 6px 14px 6px 12px;
    box-shadow: 4px 4px 0 0 var(--orange);
    transform: rotate(-2deg);
  }
  .sec-badge .jp {
    font-family: var(--display);
    font-weight: 700;
    font-size: 16px;
    color: var(--orange);
    line-height: 1;
  }
  .sec-badge .en {
    font-size: 10px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink);
  }

  /* ---- accordion ---- */
  .acc {
    display: flex;
    gap: 4px;
    height: 300px;
    margin-top: 14px;
  }
  .acc-panel {
    position: relative;
    flex: 0.62;
    cursor: pointer;
    transition: flex .5s cubic-bezier(.4,0,.2,1);
  }
  .acc-panel.active { flex: 3.6; cursor: default; }

  /* photo + overlay live in their own clipped layer, so the label can bleed out */
  .acc-media {
    position: absolute; inset: 0;
    overflow: hidden;
    border-radius: var(--radius);
    background-color: var(--panel);
  }

  .acc-media img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .5s ease;
  }
  .acc-panel:not(.active):hover .acc-media img { transform: scale(1.04); }

  /* vertical label on collapsed strips — bleeds past the photo edge like the section badges.
     Position driven by one animatable custom property so it slides smoothly instead of
     jumping when a panel flips from the right side of the active panel to the left (or back). */
  .acc-label {
    position: absolute;
    top: 10px; bottom: 10px;
    left: 50%;
    z-index: 3;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 20px;
    writing-mode: vertical-rl;
    font-family: var(--display);
    font-size: 19px; font-weight: 800;
    letter-spacing: .16em;
    color: var(--ink);
    text-shadow: 3px 3px 0 var(--orange);
    transform: translateX(-50%);
    opacity: 1;
    transition: opacity .35s ease .08s;
    pointer-events: none;
  }
  /* Each panel's side (left/right) is fixed permanently in the HTML — it
     never gets recomputed or reassigned in JS. Only opacity ever animates
     (driven purely by .active), so a label can never visibly reposition;
     there is nothing left to "jump". */
  .acc-panel.side-left  .acc-label { left: 0%; }
  .acc-panel.side-right .acc-label { left: 100%; }
  .acc-panel.active .acc-label {
    opacity: 0;
    transition: opacity .15s ease;
  }

  /* overlay shown only on active panel */
  .acc-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 22px;
    background: linear-gradient(to top, rgba(20,14,8,.68) 0%, rgba(20,14,8,.06) 55%, transparent 100%);
    color: #fff;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .3s ease .12s, transform .3s ease .12s;
    pointer-events: none;
  }
  .acc-panel.active .acc-overlay { opacity: 1; transform: none; pointer-events: auto; }

  .acc-name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .acc-name strong {
    font-family: var(--display);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -.005em;
  }
  .acc-jp { font-size: 12px; font-weight: 500; opacity: .82; }
  .acc-desc { margin: 8px 0 0; font-size: 12.5px; font-weight: 600; line-height: 1.55; opacity: .92; max-width: 34ch; }

  @media (max-width: 520px) {
    .acc { height: 260px; }
    .acc-name strong { font-size: 17px; }
  }

  /* ---- footer ---- */
  .foot {
    margin-top: 56px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 10px 20px;
    font-size: 10.5px; font-weight: 500;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .foot a { color: var(--muted); text-decoration: none; transition: color .15s ease; }
  .foot a:hover { color: var(--orange); }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <a href="/visit/">← Visit</a>
  </div>

  <section class="hero">
    <p class="hero-jp">秋のメニュー</p>
    <h1>Autumn Menu</h1>
  </section>

  <!-- MATCHA -->
  <section class="section">
    <div class="sec-badge"><span class="jp">抹茶</span><span class="en">Matcha</span></div>

    <div class="acc">
      <button class="acc-panel active side-left" type="button" aria-label="Apple Pie Matcha">
        <div class="acc-media">
          <img src="/img/jesien/apple-pie.webp" alt="Apple Pie Matcha" loading="lazy">
          <div class="acc-overlay">
            <div class="acc-name"><strong>Apple Pie Matcha</strong><span class="acc-jp">アップルパイ抹茶</span></div>
            <p class="acc-desc">Apple pie as a latte — ceremonial YUME matcha, roasted apple, cinnamon, maple syrup.</p>
          </div>
        </div>
        <span class="acc-label">アップルパイ抹茶</span>
      </button>
      <button class="acc-panel side-right" type="button" aria-label="Chai Matcha">
        <div class="acc-media">
          <img src="/img/jesien/chai.webp" alt="Chai Matcha" loading="lazy">
          <div class="acc-overlay">
            <div class="acc-name"><strong>Chai Matcha</strong><span class="acc-jp">チャイ抹茶</span></div>
            <p class="acc-desc">Ceremonial YUME matcha meets a spiced chai syrup. No espresso, no black tea.</p>
          </div>
        </div>
        <span class="acc-label">チャイ抹茶</span>
      </button>
    </div>
  </section>

  <!-- KAWA -->
  <section class="section">
    <div class="sec-badge"><span class="jp">珈琲</span><span class="en">Coffee</span></div>

    <div class="acc">
      <button class="acc-panel active side-left" type="button" aria-label="Ginger Date Latte">
        <div class="acc-media">
          <img src="/img/jesien/ginger-date.webp" alt="Ginger Date Latte" loading="lazy">
          <div class="acc-overlay">
            <div class="acc-name"><strong>Ginger Date Latte</strong><span class="acc-jp">ジンジャーデーツラテ</span></div>
            <p class="acc-desc">Specialty espresso sweetened with date syrup, cut sharp with ginger. No white sugar.</p>
          </div>
        </div>
        <span class="acc-label">ジンジャーラテ</span>
      </button>
      <button class="acc-panel side-right" type="button" aria-label="Hazelnut S'Mores Latte">
        <div class="acc-media">
          <img src="/img/jesien/smores.webp" alt="Hazelnut S'Mores Latte" loading="lazy">
          <div class="acc-overlay">
            <div class="acc-name"><strong>Hazelnut S'Mores Latte</strong><span class="acc-jp">ヘーゼルナッツスモアラテ</span></div>
            <p class="acc-desc">Espresso, hazelnut-caramel sauce and two marshmallows torched to order.</p>
          </div>
        </div>
        <span class="acc-label">スモアラテ</span>
      </button>
      <button class="acc-panel side-right" type="button" aria-label="Banana Bread & Maple Foam Iced Latte">
        <div class="acc-media">
          <img src="/img/jesien/banana-bread.webp" alt="Banana Bread & Maple Foam Iced Latte" loading="lazy">
          <div class="acc-overlay">
            <div class="acc-name"><strong>Banana Bread &amp; Maple Foam</strong><span class="acc-jp">バナナブレッド</span></div>
            <p class="acc-desc">Iced latte with banana pulp, cinnamon and a maple cold foam. Not vegan.</p>
          </div>
        </div>
        <span class="acc-label">バナナブレッド</span>
      </button>
    </div>
  </section>

  <!-- HERBATA -->
  <section class="section">
    <div class="sec-badge"><span class="jp">茶</span><span class="en">Tea</span></div>

    <div class="acc" style="height:220px">
      <button class="acc-panel active" type="button" aria-label="Hazelnut Hojicha">
        <div class="acc-media">
          <img src="/img/jesien/hojicha.webp" alt="Hazelnut Hojicha" loading="lazy">
          <div class="acc-overlay">
            <div class="acc-name"><strong>Hazelnut Hojicha</strong><span class="acc-jp">ヘーゼルナッツほうじ茶</span></div>
            <p class="acc-desc">Roasted Japanese tea with a hazelnut-caramel sauce. Low caffeine, no coffee.</p>
          </div>
        </div>
        <span class="acc-label">ほうじ茶</span>
      </button>
    </div>
  </section>

  <div class="foot">
    <a href="/visit/">← Visit</a>
    <a href="/#menu">Full menu</a>
    <a href="https://instagram.com/cafe_belmont" target="_blank" rel="noopener">Instagram</a>
  </div>

</div>
<script>
(function(){
  document.querySelectorAll('.acc').forEach(function(acc, accIndex){
    var panels = Array.prototype.slice.call(acc.querySelectorAll('.acc-panel'));
    if (panels.length < 2) return;

    var cur = panels.findIndex(function(p){ return p.classList.contains('active'); });
    if (cur < 0) cur = 0;
    var timer = null;

    function activate(i, manual){
      cur = i;
      panels.forEach(function(x){ x.classList.remove('active'); });
      panels[i].classList.add('active');
      if (manual && timer){ clearInterval(timer); timer = setInterval(next, 4500); }
    }
    function next(){ activate((cur + 1) % panels.length, false); }

    panels.forEach(function(p, idx){
      p.addEventListener('click', function(){
        if (p.classList.contains('active')) return;
        activate(idx, true);
      });
    });

    // only the second accordion on the page auto-advances; the rest stay click-only
    if (accIndex === 1) timer = setInterval(next, 4500);
  });
})();
</script>
</body>
</html>
