<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visit Café Belmont · Kazimierz, Kraków</title>
<meta name="description" content="Café Belmont in Kazimierz — reviews, directions, WiFi, and Instagram.">
<meta name="theme-color" content="#F0F0EB">
<link rel="canonical" href="https://belmont.cafe/visit/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%238fb653'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,400&family=DM+Sans:wght@300;400;500&display=swap">
<script defer src="https://stats.toodip.com/s.js" data-id="0c511152-cd70-41dc-961c-f5704fdab10f"></script>
<style>
  :root {
    --bg: #F0F0EB;
    --ink: #1A1917;
    --accent: #5E8620;
    --muted: rgba(26,25,23,.42);
    --line: rgba(26,25,23,.11);
    --line-hover: rgba(26,25,23,.24);
    --hover-fill: rgba(26,25,23,.04);
    --font-display: 'EB Garamond', Georgia, 'Times New Roman', serif;
    --font: 'DM Sans', system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111110;
      --ink: #E4E0D6;
      --accent: #7DAB2C;
      --muted: rgba(228,224,214,.42);
      --line: rgba(228,224,214,.12);
      --line-hover: rgba(228,224,214,.26);
      --hover-fill: rgba(228,224,214,.05);
    }
  }

  :root[data-theme="dark"] {
    --bg: #111110;
    --ink: #E4E0D6;
    --accent: #7DAB2C;
    --muted: rgba(228,224,214,.42);
    --line: rgba(228,224,214,.12);
    --line-hover: rgba(228,224,214,.26);
    --hover-fill: rgba(228,224,214,.05);
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap {
    max-width: 400px;
    margin: 0 auto;
    padding-inline: 24px;
    padding-block: 60px 80px;
  }

  /* ── Header ── */
  .head {
    text-align: center;
    margin-bottom: 56px;
  }

  .logo-link {
    text-decoration: none;
    color: var(--ink);
    display: inline-block;
  }

  .wordmark {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 400;
    font-style: italic;
    letter-spacing: .01em;
    line-height: 1.1;
  }

  .rule {
    width: 20px;
    height: 1px;
    background: var(--accent);
    margin: 18px auto 20px;
    opacity: .65;
  }

  .meta {
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    line-height: 2;
    letter-spacing: .025em;
  }

  /* ── Section label with rule ── */
  section { margin-bottom: 44px; }
  section:last-of-type { margin-bottom: 0; }

  .lbl {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }

  .lbl span {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  .lbl::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* ── Review tiles (3-up) ── */
  .review-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .rtile {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    text-decoration: none;
    color: var(--ink);
    transition: border-color .14s ease, background .14s ease;
    opacity: 0;
    animation: fade .5s ease forwards;
  }

  .rtile:nth-child(1) { animation-delay: .06s }
  .rtile:nth-child(2) { animation-delay: .13s }
  .rtile:nth-child(3) { animation-delay: .20s }

  @media (hover: hover) {
    .rtile:hover {
      border-color: var(--line-hover);
      background: var(--hover-fill);
    }
  }

  .rtile:active { transform: scale(.96); }

  .rtile svg {
    width: 19px;
    height: 19px;
    stroke: var(--muted);
    stroke-width: 1.5;
    fill: none;
  }

  .rtile-name {
    font-size: 10.5px;
    font-weight: 500;
    color: var(--ink);
    text-align: center;
    line-height: 1.3;
    letter-spacing: .01em;
  }

  /* ── WiFi ── */
  .wifi-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 15px 18px;
  }

  .wifi-pass {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: .04em;
    color: var(--ink);
  }

  .wifi-copy {
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 4px 0 4px 16px;
    transition: color .14s ease;
  }

  .wifi-copy:hover { color: var(--ink); }

  /* ── Directions ── */
  .address {
    font-size: 14px;
    font-weight: 300;
    color: var(--ink);
    line-height: 1.9;
    margin-bottom: 18px;
  }

  .dir-actions { display: flex; flex-direction: column; gap: 12px; }

  .dir-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: .01em;
    color: var(--muted);
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    padding: 0;
    transition: color .14s ease;
  }

  .dir-link:hover { color: var(--ink); }

  /* ── Instagram ── */
  .ig-link {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink);
    text-decoration: none;
    transition: color .14s ease;
  }

  .ig-link:hover { color: var(--muted); }

  .ig-link svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    flex: none;
  }

  /* ── Footer ── */
  .foot {
    margin-top: 56px;
    text-align: center;
  }

  .foot a {
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color .14s ease;
  }

  .foot a:hover { color: var(--ink); }

  @keyframes fade { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .rtile { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <a class="logo-link" href="/"><div class="wordmark">Café Belmont</div></a>
    <div class="rule"></div>
    <div class="meta">Berka Joselewicza 12, Kazimierz<br>Mon–Sun · 9:00–19:00</div>
  </header>

  <section>
    <div class="lbl"><span>Rate us</span></div>
    <div class="review-grid">

      <a class="rtile" href="https://www.google.com/maps/search/?api=1&query=Caf%C3%A9%20Belmont%2C%20ul.%20Berka%20Joselewicza%2012%2C%20Krak%C3%B3w" target="_blank" rel="noopener" data-toodip="google-review">
        <svg viewBox="0 0 24 24"><path d="M12 17.3l-5.4 3.1 1.4-6.1L3.3 10l6.2-.5L12 4l2.5 5.5 6.2.5-4.7 4.3 1.4 6.1z"/></svg>
        <span class="rtile-name">Google</span>
      </a>

      <a class="rtile" href="https://www.tripadvisor.com/Restaurant_Review-g274772-d34359372-Reviews-Cafe_Belmont-Krakow_Lesser_Poland_Province_Southern_Poland.html" target="_blank" rel="noopener" data-toodip="tripadvisor">
        <svg viewBox="0 0 24 24"><circle cx="7.5" cy="12.5" r="3"/><circle cx="16.5" cy="12.5" r="3"/><path d="M7.5 9.5c2-1.6 7-1.6 9 0"/></svg>
        <span class="rtile-name">TripAdvisor</span>
      </a>

      <a class="rtile" href="https://maps.apple.com/place?place-id=I53E928FE9A7B0A5D" target="_blank" rel="noopener" data-toodip="apple-maps">
        <svg viewBox="0 0 24 24"><path d="M12 21S5.5 15.2 5.5 10.5a6.5 6.5 0 1 1 13 0C18.5 15.2 12 21 12 21Z"/><circle cx="12" cy="10.5" r="1.9"/></svg>
        <span class="rtile-name">Apple Maps</span>
      </a>

    </div>
  </section>

  <section>
    <div class="lbl"><span>WiFi</span></div>
    <div class="wifi-row">
      <span class="wifi-pass" id="wifiPass">Belmont2026</span>
      <button class="wifi-copy" type="button" id="wifiBtn">Copy</button>
    </div>
  </section>

  <section>
    <div class="lbl"><span>Directions</span></div>
    <div class="address">ul. Berka Joselewicza 12<br>Kazimierz, Kraków</div>
    <div class="dir-actions">
      <a class="dir-link" href="https://www.google.com/maps/search/?api=1&query=Caf%C3%A9%20Belmont%2C%20ul.%20Berka%20Joselewicza%2012%2C%20Krak%C3%B3w" target="_blank" rel="noopener">Open in Maps →</a>
      <button class="dir-link" type="button" id="shareBtn">Send to a friend →</button>
    </div>
  </section>

  <section>
    <div class="lbl"><span>Follow</span></div>
    <a class="ig-link" href="https://instagram.com/cafe_belmont" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r="1.1" fill="currentColor" stroke="none"/></svg>
      @cafe_belmont
    </a>
  </section>

  <div class="foot"><a href="/#menu">Menu →</a></div>

</div>
<script>
  (function(){
    var wBtn = document.getElementById('wifiBtn');
    if (wBtn) {
      wBtn.addEventListener('click', function(){
        var pass = document.getElementById('wifiPass').textContent.trim();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(pass).then(function(){
            wBtn.textContent = 'Copied';
            setTimeout(function(){ wBtn.textContent = 'Copy'; }, 1500);
          }).catch(function(){});
        }
      });
    }

    var sBtn = document.getElementById('shareBtn');
    if (sBtn) {
      sBtn.addEventListener('click', function(){
        var mapsUrl = 'https://maps.google.com/?q=Caf%C3%A9+Belmont%2C+ul.+Berka+Joselewicza+12%2C+Krak%C3%B3w';
        if (navigator.share) {
          navigator.share({
            title: 'Café Belmont',
            text: 'Café Belmont · ul. Berka Joselewicza 12, Kazimierz, Kraków\nMon–Sun 9:00–19:00',
            url: mapsUrl
          }).catch(function(){});
        } else {
          window.open(mapsUrl, '_blank');
        }
      });
    }
  })();
</script>
</body>
</html>
